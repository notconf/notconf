name: build-notconf

on: [push, pull_request]

env:
  IMAGE_PATH: ghcr.io/notconf/
  CONTAINER_RUNTIME: podman

permissions:
  contents: read
  # explicit write permissions for allowing writes to organization packages
  packages: write

jobs:
  build-notconf-base:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
    - name: Set up environment
      run: echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

    - name: Show podman info
      run: |
        podman info --format '{{ .Host.LogDriver }}'
        podman create --help | grep log-driver
        podman info

    - uses: actions/checkout@v4

    - name: Cache deps
      uses: actions/cache@v4
      with:
        path: src
        key: src-${{ hashFiles('Makefile') }}

    - name: Update deps
      run: make clone-deps

    - name: Build container images
      run: make build

    - name: Run tests
      run: |
        make test
        make test-podman-to-docker

    - name: Save logs for running containers
      if: always()
      # After a successful test run there should be no containers left in the
      # GitHub runner (a runner is an isolated VM). Any leftover containers are
      # a result of a test failing so we should get the logs!
      run: CNT_PREFIX= make save-logs

    - name: Log in to the container registry
      uses: redhat-actions/podman-login@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push pipeline container images
      run: |
        make push

    - name: Tag and push release container images
      if: ${{ github.ref_name == 'main' }}
      run: |
        make tag-release
        make push-release

    - name: Store container logs in artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-logs-notconf-${{ matrix.arch }}
        path: container-logs/

  build-yangmodels:
    needs: build-notconf-base
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
    - name: Set up environment
      run: echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV

    - name: Show podman info
      run: |
        podman info --format '{{ .Host.LogDriver }}'
        podman create --help | grep log-driver
        podman info

    - uses: actions/checkout@v4

    - name: Clone yangmodels
      run: make clone-yangmodels-sparse

    - name: Pull notconf images
      run: make pull

    - name: Run tests
      # Keep going to report all failing images
      run: make -j"$(nproc)" --keep-going test-yangmodels

    - name: Save logs for running containers
      if: always()
      # After a successful test run there should be no containers left in the
      # GitHub runner (a runner is an isolated VM). Any leftover containers are
      # a result of a test failing so we should get the logs!
      run: CNT_PREFIX= make save-logs

    - name: Log in to the container registry
      uses: redhat-actions/podman-login@v1
      if: ${{ github.ref_name == 'main' }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push container images
      if: ${{ github.ref_name == 'main' }}
      run: |
        make tag-release-composed-notconf
        make push-release-composed-notconf

    - name: Store container logs in artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-logs-yangmodels-${{ matrix.arch }}
        path: container-logs/

  create-base-manifest:
    needs:
    - build-notconf-base
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Log in to the container registry
      uses: redhat-actions/podman-login@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push manifests
      run: |
        make create-manifest
        make push-manifest

    - name: Create and push release manifests
      if: ${{ github.ref_name == 'main' }}
      run: |
        make create-release-manifest
        make push-release-manifest

  create-composed-manifest:
    if: ${{ github.ref_name == 'main' }}
    needs:
    - build-yangmodels
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Log in to the container registry
      uses: redhat-actions/podman-login@v1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push release manifests
      run: |
        make create-release-yangmodels-manifests
        make push-release-yangmodels-manifests
